name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ \
            qt6-base-dev qt6-declarative-dev qt6-multimedia-dev qt6-wayland \
            liblayershellqt-dev \
            libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DSOTTO_GPU=cpu

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke run
        run: ./build/sotto --help

      # Produces the actual downloadable artifact — the AppImage that goes
      # on the website's download button. See packaging/linux/build-
      # appimage.sh for what this does and why; qt6-wayland above is what
      # makes it a *working* Sotto rather than one silently missing Wayland
      # support (Qt falls back to XWayland without it, no build error).
      - name: Build AppImage
        run: packaging/linux/build-appimage.sh build

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Sotto-linux-x86_64
          # Globbed rather than named: the filename carries the version, which
          # this workflow has no business knowing.
          path: build/Sotto-*.AppImage
          if-no-files-found: error
