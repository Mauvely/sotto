# Build, test and package on every PR and every push to main.
#
# The packaging steps are here rather than only in release.yml on purpose:
# packaging is the part that breaks silently — a missing WebEngine resource, a
# WiX toolset change, a renamed desktop file — and finding that out at release
# time means finding it out when you wanted to ship. Building the artifacts on
# every PR costs a few minutes and makes those failures land on the PR that
# caused them.
#
# Relay's own CI is workflow_dispatch-only because Actions minutes are a real
# budget on this account. The paths-ignore below is the compromise: a docs-only
# or changes/-only commit does not spend a Qt build on two platforms.
# ── Where these run ─────────────────────────────────────────────────────────
#
# `runs-on` reads a repository variable and falls back to GitHub's runners, so
# moving a repository onto your own machine is one variable, not a workflow
# edit — and moving it back, when the machine is off or mid-upgrade, is the
# same variable again.
#
#   RUNNER_LINUX     a label on your Linux runner,   e.g. mauvely-linux
#   RUNNER_WINDOWS   a label on your Windows runner, e.g. mauvely-windows
#   QT_PREFIX        a Qt already on the runner, e.g. C:/Qt/6.7.3/msvc2019_64
#                    or /opt/Qt/6.7.3/gcc_64. Unset downloads one per run.
#
# Unset means GitHub-hosted, which is what every repository does until somebody
# decides otherwise. Use a *custom* label rather than `self-hosted`: with one
# label per platform a job cannot land on the wrong machine, and a second
# runner can be added to a label later to get parallelism for free.
#
# Self-hosted runners are safe here because every repository in this suite is
# private. On a public repository a pull request from a fork would run its own
# code on your hardware with your secrets in scope, which is why GitHub warns
# against exactly that.

name: CI

on:
  pull_request:
    paths-ignore: ['docs/**', 'changes/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'changes/**', '**/*.md']
  workflow_dispatch:
    inputs:
      installers:
        description: 'Also upload the AppImage and MSI as artifacts'
        type: boolean
        default: false

concurrency:
  # A force-push should not leave the previous build burning minutes.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── The only block a fork edits ─────────────────────────────────────────────
#
# Everything else reads build/app-info.json, which CMake generates from
# cmake/MauvelyAppInfo.cmake, so no step here names a binary or an app.
env:
  # Qt modules beyond qtbase, for aqtinstall. QtWebEngine's CMake config
  # hard-depends on Qt6WebChannel and Qt6Positioning, which aqt does not pull in
  # on its own — without them find_package(WebEngineWidgets) fails as a unit and
  # the app silently falls back to a placeholder.
  QT_MODULES: 'qtmultimedia qtshadertools'
  # Extra configure flags. Each app turns its own optional dependencies into
  # hard errors here, so a missing module fails the build instead of silently
  # shipping a degraded binary.
  CONFIGURE_FLAGS: -DSOTTO_GPU=cpu
  CONFIGURE_FLAGS_LINUX: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The label, not the image name — see the note at the top of the file.
          - os: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
            name: Linux
          - os: ${{ vars.RUNNER_WINDOWS || 'windows-latest' }}
            name: Windows

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        # Qt will not start, even offscreen, without the xcb set. libfuse2 is for
        # the AppImage tools; libcups2-dev is for Qt6PrintSupport, which
        # QtWebEngineWidgets depends on — a CUPS problem presents as a missing
        # WebEngine, which cost Compose a week of CI archaeology.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libcups2-dev \
            libfuse2 \
            librsvg2-bin

      - name: Install Qt
        # Skipped when the runner already has one — see QT_PREFIX at the top of
        # the file. Downloading five gigabytes of Qt onto a machine that has it
        # installed is the single slowest pointless thing a self-hosted run does.
        if: vars.QT_PREFIX == ''
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          modules: ${{ env.QT_MODULES }}
          cache: true
          # Bump this to bust a cache that is suspected of being out of step
          # with its key. A Linux cache that had silently lost WebEngine is what
          # kept Compose's CI red for a fortnight.
          cache-key-prefix: 'qt-appbase-v1'

      - name: Use the runner's own Qt
        if: vars.QT_PREFIX != ''
        shell: bash
        # Mirrors what install-qt-action exports, so nothing downstream has to
        # know which of the two ran.
        #
        # A Qt you installed and pinned on a machine you control is *better*
        # provenance than a downloaded archive, which is the concern the
        # `cache: false` below was written for — so this does not weaken it.
        run: |
          set -euo pipefail
          QT='${{ vars.QT_PREFIX }}'
          # CMake reads CMAKE_PREFIX_PATH from the environment using the *platform*
          # list separator, so this is ':' on Linux and ';' on Windows. Getting it
          # backwards produces one unfindable path rather than an error.
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=';'; else SEP=':'; fi
          echo "QT_ROOT_DIR=$QT" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$QT${CMAKE_PREFIX_PATH:+$SEP$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          echo "$QT/bin" >> "$GITHUB_PATH"
      - name: Configure
        shell: bash
        run: |
          FLAGS="$CONFIGURE_FLAGS"
          # Appended, not a second configure call. Re-running cmake with only
          # the extra flag works because the rest persist in the cache, but it
          # reads as though they were optional and it is one edit away from
          # being wrong.
          if [ "$RUNNER_OS" = "Linux" ]; then FLAGS="$FLAGS $CONFIGURE_FLAGS_LINUX"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $FLAGS

      - name: Build
        shell: bash
        # Bounded on purpose. A bare `-j` means UNLIMITED jobs to Make, not "one
        # per core", so Compose's first Linux build to get this far launched 58
        # concurrent cc1plus processes and the kernel OOM-killed the compiler:
        #   c++: fatal error: Killed signal terminated program cc1plus
        # It read as a hang, because the runner died mid-link.
        run: cmake --build build --config Release --parallel "$(nproc 2>/dev/null || echo 4)"

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Smoke-run (Linux)
        if: runner.os == 'Linux'
        # Sotto has no offscreen screenshot harness: its only always-present
        # window is a 440x64 HUD that stays hidden unless dictation is running,
        # so there is no chrome to grab. `--version` at least proves the binary
        # links, starts and reaches main() with the whisper.cpp static library
        # attached — which is the part most likely to break.
        run: |
          mkdir -p shots
          BIN="$(python3 -c 'import json;print(json.load(open("build/app-info.json"))["binary"])')"
          EXE="build/bin/Release/$BIN"; [ -x "$EXE" ] || EXE="build/bin/$BIN"
          QT_QPA_PLATFORM=offscreen "$EXE" --version

      - name: Which platforms does this app target?
        id: targets
        shell: bash
        # From build/app-info.json, so the answer lives with the app rather than
        # being repeated in a workflow. Snap targets Windows only: Wayland has no
        # workable story for a third-party screenshot tool, since every capture
        # raises the compositor's own source-selection prompt.
        #
        # The build and the tests above still ran. Not packaging a platform is
        # not a reason to stop compiling for it — that is how portable code rots.
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json, os
          info = json.load(open("build/app-info.json"))
          key = "linux" if os.environ["RUNNER_OS"] == "Linux" else "windows"
          print(f"ships={'true' if info['formats'][key] else 'false'}")
          PYEOF

      - name: Package (Linux)
        if: runner.os == 'Linux' && steps.targets.outputs.ships == 'true'
        # AppImage only. A Flatpak build pulls a ~1.5 GB runtime and an SDK and
        # then compiles Qt code inside it, which is twenty minutes CI does not
        # need to spend on a pull request — release.yml does build it, so a
        # Flatpak-only break is caught before it ships, just not on the PR.
        run: ./scripts/package.sh --format appimage --build-dir build

      - name: Smoke-run the AppImage (Linux)
        if: runner.os == 'Linux' && steps.targets.outputs.ships == 'true'
        # The artifact, not the build-tree binary. Everything up to here proves
        # the *build* works; this is the only step that proves the thing a user
        # downloads actually starts. It relies on the offscreen platform plugin
        # being bundled — see build-appimage.sh, which adds it for exactly this.
        run: |
          APPIMAGE="$(ls build/*.AppImage | head -1)"
          QT_QPA_PLATFORM=offscreen QT_FORCE_STDERR_LOGGING=1 "$APPIMAGE" --version

      - name: Package (Windows)
        if: runner.os == 'Windows' && steps.targets.outputs.ships == 'true'
        shell: pwsh
        # WiX v3's candle/light are not on windows-latest by default. MSI only
        # here: the MSIX needs Partner Center identity that a fork of this
        # template does not have, and release.yml is where it is built.
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset -y --no-progress
          }
          ./scripts/package.ps1 -Format msi -BuildDir build

      # ── What leaves the runner, and what does not ───────────────────────
      #
      # Artifact storage is billed by the gigabyte-month and counts across
      # every repository in the account — the same quota release.yml refuses to
      # touch, with the same consequence when it fills: every workflow in the
      # account fails, including the ones that publish.
      #
      # This step used to upload the AppImage and the MSI on every pull request
      # and every push to main. A WebEngine AppImage is a couple of hundred
      # megabytes, there are eight repositories on this template, and each copy
      # was kept for a week. Nobody downloaded them: an installer on a pull
      # request is for the rare occasion somebody wants to run the branch, and
      # the *screenshots* are what a review actually looks at.
      #
      # So the screenshots always, and the installers only when asked for.

      - name: Upload the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.name }}-shots
          path: shots/**
          # A build that renders no screenshots is a failed build, not a
          # warning. `warn` here is how an empty artifact went unnoticed in
          # Compose for months.
          if-no-files-found: error
          # Long enough to review the run that produced them; a screenshot
          # nobody looked at in three days is a screenshot nobody will.
          retention-days: 3

      - name: Upload the installer
        # Run the workflow by hand with `installers` ticked when you want to
        # put the build on a machine. The packaging steps above still run on
        # every push, so a broken installer is still caught — it is only the
        # upload that is on demand.
        if: github.event_name == 'workflow_dispatch' && inputs.installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.name }}
          path: |
            build/*.AppImage
            build/*.msi
          if-no-files-found: error
          retention-days: 3
