# Build, test and package on every PR and every push to main.
#
# The packaging steps are here rather than only in release.yml on purpose:
# packaging is the part that breaks silently — a missing WebEngine resource, a
# WiX toolset change, a renamed desktop file — and finding that out at release
# time means finding it out when you wanted to ship. Building the artifacts on
# every PR costs a few minutes and makes those failures land on the PR that
# caused them.
#
# Relay's own CI is workflow_dispatch-only because Actions minutes are a real
# budget on this account. The paths-ignore below is the compromise: a docs-only
# or changes/-only commit does not spend a Qt build on two platforms.
name: CI

on:
  pull_request:
    paths-ignore: ['docs/**', 'changes/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'changes/**', '**/*.md']
  workflow_dispatch:

concurrency:
  # A force-push should not leave the previous build burning minutes.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── The only block a fork edits ─────────────────────────────────────────────
#
# Everything else reads build/app-info.json, which CMake generates from
# cmake/MauvelyAppInfo.cmake, so no step here names a binary or an app.
env:
  # Qt modules beyond qtbase, for aqtinstall. QtWebEngine's CMake config
  # hard-depends on Qt6WebChannel and Qt6Positioning, which aqt does not pull in
  # on its own — without them find_package(WebEngineWidgets) fails as a unit and
  # the app silently falls back to a placeholder.
  QT_MODULES: 'qtmultimedia qtdeclarative qtshadertools'
  # Extra configure flags. Each app turns its own optional dependencies into
  # hard errors here, so a missing module fails the build instead of silently
  # shipping a degraded binary.
  # cpu, not the GPU backends: HIP and CUDA need toolchains no hosted runner
  # has, and a portable artifact must run on a machine without either. The
  # GPU builds are for people compiling locally.
  CONFIGURE_FLAGS: -DSOTTO_GPU=cpu
  CONFIGURE_FLAGS_LINUX: ''

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Linux
          - os: windows-latest
            name: Windows

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        # Qt will not start, even offscreen, without the xcb set. libfuse2 is for
        # the AppImage tools; libcups2-dev is for Qt6PrintSupport, which
        # QtWebEngineWidgets depends on — a CUPS problem presents as a missing
        # WebEngine, which cost Compose a week of CI archaeology.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-xinerama0 \
            libcups2-dev \
            libfuse2 \
            librsvg2-bin

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          modules: ${{ env.QT_MODULES }}
          cache: true
          # Bump this to bust a cache that is suspected of being out of step
          # with its key. A Linux cache that had silently lost WebEngine is what
          # kept Compose's CI red for a fortnight.
          cache-key-prefix: 'qt-appbase-v1'

      - name: Configure
        shell: bash
        run: |
          FLAGS="$CONFIGURE_FLAGS"
          # Appended, not a second configure call. Re-running cmake with only
          # the extra flag works because the rest persist in the cache, but it
          # reads as though they were optional and it is one edit away from
          # being wrong.
          if [ "$RUNNER_OS" = "Linux" ]; then FLAGS="$FLAGS $CONFIGURE_FLAGS_LINUX"; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $FLAGS

      - name: Build
        shell: bash
        # Bounded on purpose. A bare `-j` means UNLIMITED jobs to Make, not "one
        # per core", so Compose's first Linux build to get this far launched 58
        # concurrent cc1plus processes and the kernel OOM-killed the compiler:
        #   c++: fatal error: Killed signal terminated program cc1plus
        # It read as a hang, because the runner died mid-link.
        run: cmake --build build --config Release --parallel "$(nproc 2>/dev/null || echo 4)"

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Smoke-run (Linux)
        if: runner.os == 'Linux'
        # Sotto has no offscreen screenshot harness: its only always-present
        # window is a 440x64 HUD that is hidden unless dictation is running, so
        # there is no chrome to grab. `--version` at least proves the binary
        # links, starts and reaches main() with the whisper.cpp static library
        # attached — which is the part most likely to break.
        run: |
          mkdir -p shots
          BIN="$(python3 -c 'import json;print(json.load(open("build/app-info.json"))["binary"])')"
          EXE="build/bin/Release/$BIN"; [ -x "$EXE" ] || EXE="build/bin/$BIN"
          [ -x "$EXE" ] || EXE="build/$BIN"
          QT_QPA_PLATFORM=offscreen "$EXE" --version

      - name: Package (Linux)
        if: runner.os == 'Linux'
        # AppImage only. A Flatpak build pulls a ~1.5 GB runtime and an SDK and
        # then compiles Qt code inside it, which is twenty minutes CI does not
        # need to spend on a pull request — release.yml does build it, so a
        # Flatpak-only break is caught before it ships, just not on the PR.
        run: ./scripts/package.sh --format appimage --build-dir build

      - name: Smoke-run the AppImage (Linux)
        if: runner.os == 'Linux'
        # The artifact, not the build-tree binary. Everything up to here proves
        # the *build* works; this is the only step that proves the thing a user
        # downloads actually starts — with the bundled Qt, the bundled fonts and
        # the statically linked whisper.cpp, none of which the build tree
        # exercises. It relies on the offscreen platform plugin being bundled;
        # see build-appimage.sh, which adds it for exactly this.
        run: |
          APPIMAGE="$(ls build/*.AppImage | head -1)"
          QT_QPA_PLATFORM=offscreen QT_FORCE_STDERR_LOGGING=1 "$APPIMAGE" --version

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # WiX v3's candle/light are not on windows-latest by default. MSI only
        # here: the MSIX needs Partner Center identity that a fork of this
        # template does not have, and release.yml is where it is built.
        run: |
          choco install wixtoolset -y --no-progress
          ./scripts/package.ps1 -Format msi -BuildDir build

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-${{ matrix.name }}
          path: |
            build/*.AppImage
            build/*.msi
            shots/**
          # A build that produces no installer is a failed build, not a warning.
          # `warn` here is how an empty artifact went unnoticed in Compose for
          # months.
          if-no-files-found: error
          retention-days: 7
