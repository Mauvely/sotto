# Ship a release when a version bump lands on main.
#
# The trigger is deliberately "merge to main", not a tag: the version already has
# one source of truth — project(VERSION) in CMakeLists.txt, compiled in as
# APP_VERSION and compared against by the updater — and asking for a tag as well
# means two things to keep in step. The gate job reads that version and asks the
# release service whether it has already shipped. Bump it and merge, and a
# release goes out. Merge anything else and only the gate runs.
#
#   Linux    AppImage ─► R2 ─► POST /api/releases  (format: appimage, primary)
#            Flatpak  ─► R2 ─► POST /api/releases  (format: flatpak)
#   Windows  MSI      ─► R2 ─► POST /api/releases  (format: msi, primary)
#            MSIX     ─► Microsoft Store ─► POST  (format: msstore)
#
# Four artifacts, but only two of them are the *update* answer. `/api/releases/
# latest` returns the primary row per platform, so an installed AppImage is told
# about the next AppImage and never about a Flatpak it cannot apply. Flatpak and
# the Store own their own update mechanisms; they are registered so the download
# button can offer them, not so anything self-updates into them.
#
# ── Two Windows builds, not one ─────────────────────────────────────────────
#
# The MSI keeps the self-updater; the MSIX must not have it. An MSIX cannot
# replace its own package, so a Store build that tried to self-update would
# download successfully, fail to apply, and leave a permanent "restart to
# update" that never finishes. Hence APP_STORE_BUILD=OFF then =ON, sharing one
# checkout and one Qt install.
#
# ── Nothing here uses GitHub artifact storage ───────────────────────────────
#
# No upload-artifact/download-artifact handoff, on purpose. Each build job
# publishes its own output and reports metadata through job outputs, which are
# free. Artifact storage is billed against the account's Actions quota, and a
# full quota fails every workflow in the account — including this one.
# Self-hosted runners do not change that: the storage is GitHub's.
#
# ── Required configuration ──────────────────────────────────────────────────
#
# Secrets:
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
#   MAUVELY_RELEASES_TOKEN     — must match the Worker's RELEASES_TOKEN
#   MSSTORE_TENANT_ID / MSSTORE_CLIENT_ID / MSSTORE_CLIENT_SECRET
#
# Variables (same settings page, Variables tab). Not secrets: none is a
# credential, and being readable in a log is what makes an identity mismatch
# diagnosable at all.
#   MSSTORE_SELLER_ID, MSSTORE_PRODUCT_ID, MSSTORE_IDENTITY_NAME,
#   MSSTORE_PUBLISHER, MSSTORE_PUBLISHER_DISPLAY
#   PUBLISH_WINDOWS   — "true" to publish the Windows lane. Unset means build
#                       and verify but do not ship, which is where an app with
#                       an untested port sits (Sotto). Flip one variable to
#                       start shipping.
# ── Where these run ─────────────────────────────────────────────────────────
#
# `runs-on` reads a repository variable and falls back to GitHub's runners, so
# moving a repository onto your own machine is one variable, not a workflow
# edit — and moving it back, when the machine is off or mid-upgrade, is the
# same variable again.
#
#   RUNNER_LINUX     a label on your Linux runner,   e.g. mauvely-linux
#   RUNNER_WINDOWS   a label on your Windows runner, e.g. mauvely-windows
#   QT_PREFIX_LINUX    a Qt on the Linux runner,   e.g. /opt/Qt/6.7.3/gcc_64
#   QT_PREFIX_WINDOWS  a Qt on the Windows runner, e.g. C:/Qt/6.7.3/msvc2019_64
#   QT_PREFIX          the fallback for either, from when only one platform was
#                      self-hosted. One value cannot be both paths, so the two
#                      above are what a machine with both runners needs.
#                    or /opt/Qt/6.7.3/gcc_64. Unset downloads one per run.
#
# Unset means GitHub-hosted, which is what every repository does until somebody
# decides otherwise. Use a *custom* label rather than `self-hosted`: with one
# label per platform a job cannot land on the wrong machine, and a second
# runner can be added to a label later to get parallelism for free.
#
# Self-hosted runners are safe here because every repository in this suite is
# private. On a public repository a pull request from a fork would run its own
# code on your hardware with your secrets in scope, which is why GitHub warns
# against exactly that.

name: Release

on:
  push:
    branches: [main]
    # The version this releases lives in CMakeLists.txt, so a commit that
    # touches only prose cannot start one — and the changes-note convention
    # means every real commit is followed by exactly such a commit. ci.yml has
    # ignored these three since it was written; this file never did, and paid a
    # gate job per note in every repository.
    paths-ignore: ['docs/**', 'changes/**', '**/*.md']
  workflow_dispatch:
    inputs:
      republish:
        description: 'Rebuild and re-upload every platform, even ones already registered'
        type: boolean
        default: false

concurrency:
  # Two releases publishing at once would race on the same version directory,
  # and Partner Center rejects a second submission while one is pending.
  group: release
  cancel-in-progress: false

# ── The only block a fork edits ─────────────────────────────────────────────
env:
  APP_KEY: sotto
  API_BASE: https://mauvely.com
  # Qt modules beyond qtbase, for aqtinstall.
  QT_MODULES: 'qtmultimedia qtshadertools'
  # Extra configure flags — each app's own APP_REQUIRE_* equivalents.
  CONFIGURE_FLAGS: -DSOTTO_GPU=cpu
  CONFIGURE_FLAGS_LINUX: ''
  # The CMake option that compiles out the self-updater for a Store build.
  # Spelled differently per app (CE_STORE_BUILD in Compose, PLAY_STORE_BUILD in
  # Play) because the macro prefixes were never unified — a rename that would
  # touch every file in two repos and buy nothing.
  STORE_BUILD_OPTION: SOTTO_STORE_BUILD

jobs:
  gate:
    name: Should we release?
    # app-base is the template, not a product: it has no feed entry and no
    # secrets, so publishing it would fail loudly and pointlessly on every merge.
    # A fork inherits this line harmlessly — its repository is not app-base.
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
      need_linux: ${{ steps.check.outputs.need_linux }}
      need_windows: ${{ steps.check.outputs.need_windows }}
    steps:
      - uses: actions/checkout@v4

      # Is this repository set up to publish at all?
      #
      # Not the same question as "is the configuration complete", which is
      # asked further down and is an error. A repository with *none* of the
      # four credentials has never been set up to release — play, relay, snap,
      # sotto and suite are all in that state — and since none of them has ever
      # published a version, the gate below says "release" on every single push
      # and the job failed every single time. A repository that cannot publish
      # anything is not a broken build; it is a repository nobody has given
      # credentials to yet, and it should say so once in the summary rather
      # than by email on every merge.
      #
      # Some-but-not-all is still an error: that is a mistake rather than a
      # state, and it is what the completeness check below exists to catch.
      - id: configured
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MAUVELY_RELEASES_TOKEN: ${{ secrets.MAUVELY_RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          present=0
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID \
                      R2_SECRET_ACCESS_KEY MAUVELY_RELEASES_TOKEN; do
            [[ -n "${!name:-}" ]] && present=$((present + 1))
          done

          if (( present == 0 )); then
            echo "publishable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No release credentials in this repository, so" \
                 "there is nothing this workflow can publish. Add" \
                 "R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY" \
                 "and MAUVELY_RELEASES_TOKEN under Settings ->" \
                 "Secrets and variables -> Actions."
            {
              echo "### Not set up to release"
              echo
              echo "This repository has none of the four release credentials, so"
              echo "the build stops here rather than failing. Add them under"
              echo "**Settings -> Secrets and variables -> Actions**:"
              echo
              echo "| Secret |"
              echo "|---|"
              echo "| \`R2_ACCOUNT_ID\` |"
              echo "| \`R2_ACCESS_KEY_ID\` |"
              echo "| \`R2_SECRET_ACCESS_KEY\` |"
              echo "| \`MAUVELY_RELEASES_TOKEN\` |"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "publishable=true" >> "$GITHUB_OUTPUT"
          fi

      - id: check
        if: steps.configured.outputs.publishable == 'true'
        env:
          # `workflow_dispatch` with republish=true asks the platforms to be
          # built and uploaded again even where a row exists. For the case where
          # a row is present but the object behind it is not — a bucket
          # lifecycle rule, a hand-deleted key — which nothing else can repair.
          REPUBLISH: ${{ github.event.inputs.republish }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^[[:space:]]*VERSION[[:space:]]\+\([0-9][0-9.]*\).*/\1/p' \
              CMakeLists.txt | head -1)"
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not read project(VERSION ...) from CMakeLists.txt"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Failing to ask is treated as "do not release" rather than "release
          # anyway" — publishing twice off a transient network error is the
          # worse outcome.
          if ! RESPONSE="$(curl -fsS --retry 3 \
                "$API_BASE/api/releases?app=$APP_KEY&version=$VERSION")"; then
            echo "::error::Could not reach the release service at $API_BASE." \
                 "Refusing to release without knowing what $VERSION already has."
            exit 1
          fi

          # ── Per platform, not per version ──────────────────────────────
          #
          # This used to ask "does *any* row exist for this version?" and skip
          # the whole release if one did. A run where Linux published and
          # Windows did not then left a version that could never be completed:
          # the next run saw the Linux rows, concluded the version had shipped,
          # and skipped both lanes. The only escape was a version bump, and
          # meanwhile the feed served an update to half its users.
          #
          # Compose 0.5.3 sat in exactly that state — an AppImage and a Flatpak
          # published, no Windows row, and a green build every time.
          #
          # Asking per platform makes a re-run finish what a failed run started,
          # which is the property a release job most needs and the one it did
          # not have.
          eval "$(printf '%s' "$RESPONSE" | python3 -c '
          import json, os, sys
          items = json.load(sys.stdin)["items"]
          have = {i["platform"] for i in items if i.get("isPrimary")}
          again = os.environ.get("REPUBLISH") == "true"
          for gh, platform in (("linux", "linux-x86_64"), ("windows", "windows-x86_64")):
              need = again or platform not in have
              print(f"NEED_{gh.upper()}={str(need).lower()}")
          ')"

          echo "need_linux=$NEED_LINUX" >> "$GITHUB_OUTPUT"
          echo "need_windows=$NEED_WINDOWS" >> "$GITHUB_OUTPUT"

          if [[ "$NEED_LINUX" == "false" && "$NEED_WINDOWS" == "false" ]]; then
            echo "::notice::$APP_KEY $VERSION has a primary row on every platform — nothing to do."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$APP_KEY $VERSION needs: linux=$NEED_LINUX windows=$NEED_WINDOWS"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

      # Up front, before either build spends twenty minutes. This used to live in
      # the publish job, where a missing secret was found *after* both builds had
      # succeeded — a forty-minute round trip to learn that a value was never
      # set. An unset R2_ACCOUNT_ID earns a check of its own: it expands to an
      # empty string inside the endpoint URL and the upload dies on
      #   aws: [ERROR]: Invalid endpoint: https://.r2.cloudflarestorage.com
      # which never mentions a secret at all.
      - name: Check the release configuration is complete
        if: steps.check.outputs.should_release == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          MAUVELY_RELEASES_TOKEN: ${{ secrets.MAUVELY_RELEASES_TOKEN }}
          PUBLISH_WINDOWS: ${{ vars.PUBLISH_WINDOWS }}
          MSSTORE_PRODUCT_ID: ${{ vars.MSSTORE_PRODUCT_ID }}
          MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
        run: |
          set -euo pipefail
          missing=()
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY \
                      MAUVELY_RELEASES_TOKEN; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ "${PUBLISH_WINDOWS:-}" == "true" ]]; then
            for name in MSSTORE_PRODUCT_ID MSSTORE_IDENTITY_NAME MSSTORE_PUBLISHER; do
              [[ -n "${!name:-}" ]] || missing+=("$name")
            done
          fi
          if (( ${#missing[@]} )); then
            echo "::error::Release configuration incomplete: ${missing[*]}." \
                 "Secrets and variables both live under" \
                 "Settings -> Secrets and variables -> Actions;" \
                 "the header of this workflow says which is which."
            exit 1
          fi
          # A wrong publisher is the most common first-release failure and the
          # upload error does not say where to look, so name it here instead.
          if [[ -n "${MSSTORE_PUBLISHER:-}" && "$MSSTORE_PUBLISHER" != CN=* ]]; then
            echo "::error::MSSTORE_PUBLISHER must be the Partner Center publisher" \
                 "identity and start with 'CN=' (got '$MSSTORE_PUBLISHER')." \
                 "It is a CN=<guid>, not a company name."
            exit 1
          fi
          echo "Release configuration is complete."

  # ── Linux: AppImage + Flatpak → R2 ────────────────────────────────────────
  linux:
    name: Linux (AppImage + Flatpak)
    needs: gate
    if: needs.gate.outputs.need_linux == 'true'
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    # Six hours is the default and this job takes twenty-five minutes. A hung
    # runner spending the rest of the account's budget is the failure this
    # prevents; the number is generous, not tight.
    timeout-minutes: 90
    outputs:
      appimage: ${{ steps.publish.outputs.appimage }}
      appimage_sha: ${{ steps.publish.outputs.appimage_sha }}
      flatpak: ${{ steps.publish.outputs.flatpak }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Make room on the runner
        # ── GitHub-hosted only, and that guard is load-bearing ────────────
        #
        # This deletes the Android SDK, .NET, GHC and every Docker image on the
        # machine. On a throwaway runner that is reclaiming space nobody will
        # miss. On a runner you own it is deleting somebody's toolchains and
        # somebody's containers, permanently, to make room on a disk that
        # probably had room already.
        #
        # `runner.environment` is `github-hosted` or `self-hosted`, so the
        # distinction is one the runner itself makes rather than something a
        # label has to encode correctly.
        if: runner.environment == 'github-hosted'
        # ubuntu-latest arrives with about 25 GB free and roughly 25 GB of
        # preinstalled toolchains this build will never touch. Qt with
        # QtWebEngine is ~5 GB, the build tree is several more, and
        # flatpak-builder then pulls the KDE runtime *and* SDK — so the job
        # finishes close enough to the line that a slightly larger Qt release
        # tips it over, and a disk-full failure reads as a compiler error
        # somewhere in the middle of the build.
        #
        # The `df` either side is the point as much as the deletion: if this
        # ever fails for space again, the log says how much there was.
        run: |
          echo "Before:"; df -h / | tail -1
          sudo rm -rf /usr/local/lib/android \
                      /usr/share/dotnet \
                      /opt/ghc \
                      /usr/local/.ghcup \
                      /usr/local/share/powershell \
                      /usr/share/swift \
                      "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          echo "After:"; df -h / | tail -1

      - name: Install Linux dependencies
        run: |
          # Seven runner services share this machine, so seven jobs can reach apt at
          # the same moment and there is one dpkg lock between them. Pushing all eight
          # repos together did exactly that, and the losers died with
          #     E: Could not get lock /var/lib/dpkg/lock-frontend
          # DPkg::Lock::Timeout is apt's own answer: wait for the lock rather than
          # fail on it. Inert on a hosted runner, where nothing else is running.
          sudo apt-get -o DPkg::Lock::Timeout=600 update
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y \
            libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libcups2-dev librsvg2-bin \
            flatpak flatpak-builder
          # libfuse2 became libfuse2t64 in the 64-bit time_t transition — see
          # ci.yml. One name does not serve every release this runs on.
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y libfuse2t64 \
            || sudo apt-get -o DPkg::Lock::Timeout=600 install -y libfuse2

      - name: Install Qt
        # Skipped when the runner already has one — see QT_PREFIX at the top of
        # the file. Downloading five gigabytes of Qt onto a machine that has it
        # installed is the single slowest pointless thing a self-hosted run does.
        if: (vars.QT_PREFIX_LINUX || vars.QT_PREFIX) == ''
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          modules: ${{ env.QT_MODULES }}
          # Deliberately uncached, unlike ci.yml. A release must not be built
          # from a toolchain archive of unknown provenance: the cache key cannot
          # express whether its contents are complete. Costs a couple of minutes
          # and removes the whole class of "green on CI, broken in the artifact".
          cache: false

      - name: Use the runner's own Qt
        if: (vars.QT_PREFIX_LINUX || vars.QT_PREFIX) != ''
        shell: bash
        # Mirrors what install-qt-action exports, so nothing downstream has to
        # know which of the two ran.
        #
        # A Qt you installed and pinned on a machine you control is *better*
        # provenance than a downloaded archive, which is the concern the
        # `cache: false` below was written for — so this does not weaken it.
        run: |
          set -euo pipefail
          QT='${{ vars.QT_PREFIX_LINUX || vars.QT_PREFIX }}'
          # CMake reads CMAKE_PREFIX_PATH from the environment using the *platform*
          # list separator, so this is ':' on Linux and ';' on Windows. Getting it
          # backwards produces one unfindable path rather than an error.
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=';'; else SEP=':'; fi
          echo "QT_ROOT_DIR=$QT" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$QT${CMAKE_PREFIX_PATH:+$SEP$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          echo "$QT/bin" >> "$GITHUB_PATH"
          # The runtime half, and it is not optional on Linux. install-qt-action
          # exports these too, and without them linuxdeploy walks the binary,
          # fails to resolve libQt6Widgets.so.6 and stops — which is what the
          # first real self-hosted run did. Windows finds its DLLs through PATH,
          # which is already set above.
          if [ "$RUNNER_OS" != "Windows" ]; then
            echo "LD_LIBRARY_PATH=$QT/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
            echo "QT_PLUGIN_PATH=$QT/plugins" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          $CONFIGURE_FLAGS $CONFIGURE_FLAGS_LINUX

      - name: Build
        run: cmake --build build --config Release --parallel "$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Which platforms does this app target?
        id: targets
        shell: bash
        # From build/app-info.json, so the answer lives with the app rather than
        # being repeated in a workflow. Snap targets Windows only: Wayland has no
        # workable story for a third-party screenshot tool, since every capture
        # raises the compositor's own source-selection prompt.
        #
        # The build and the tests above still ran. Not packaging a platform is
        # not a reason to stop compiling for it — that is how portable code rots.
        run: |
          python3 - <<'PYEOF' >> "$GITHUB_OUTPUT"
          import json, os
          info = json.load(open("build/app-info.json"))
          key = "linux" if os.environ["RUNNER_OS"] == "Linux" else "windows"
          print(f"ships={'true' if info['formats'][key] else 'false'}")
          PYEOF

      - name: Package
        if: steps.targets.outputs.ships == 'true'
        run: ./scripts/package.sh --format all --build-dir build --out dist

      - name: Upload and register
        id: publish
        if: steps.targets.outputs.ships == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # A transient 5xx from R2 used to fail a job that had already spent
          # twenty-five minutes building. Adaptive mode backs off rather than
          # hammering, which is what a large multipart upload wants.
          AWS_MAX_ATTEMPTS: '5'
          AWS_RETRY_MODE: adaptive
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          RELEASES_TOKEN: ${{ secrets.MAUVELY_RELEASES_TOKEN }}
          V: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail

          # Upload, THEN register — never the other way round. POST
          # /api/releases calls R2.head() and refuses if the object is missing
          # or a different size, so a failure between the two leaves an
          # unreferenced object at worst, never a feed entry pointing at a 404.
          # The register call is an upsert, so re-running a failed publish is
          # safe.
          publish() {
            local file="$1" format="$2" primary="$3"
            local name; name="$(basename "$file")"
            local key="$APP_KEY/$V/$name"
            local endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"

            aws s3 cp "$file" "s3://mauvely-releases/$key" \
              --endpoint-url "$endpoint" \
              --only-show-errors

            # Ask R2 for it back before telling the feed it exists.
            #
            # The Worker already refuses to register an object it cannot head,
            # so this is not the only guard — but it turns "the API rejected
            # the registration" into "the upload did not land", which is the
            # difference between a five-minute diagnosis and an hour of reading
            # Worker logs. It also catches a truncated upload, which a
            # successful `cp` exit code does not.
            local remote
            remote="$(aws s3api head-object --bucket mauvely-releases --key "$key" \
                        --endpoint-url "$endpoint" --query ContentLength --output text)"
            local local_size; local_size="$(stat -c%s "$file")"
            if [[ "$remote" != "$local_size" ]]; then
              echo "::error::$name uploaded as $remote bytes, expected $local_size"
              return 1
            fi
            cat > meta.json <<EOF
          {"app":"$APP_KEY","version":"$V","platform":"linux-x86_64",
           "format":"$format","filename":"$name",
           "size":$(stat -c%s "$file"),
           "sha256":"$(sha256sum "$file" | cut -d' ' -f1)",
           "isPrimary":$primary}
          EOF
            curl -fsS -X POST "$API_BASE/api/releases" \
              -H "authorization: Bearer $RELEASES_TOKEN" \
              -H 'content-type: application/json' \
              --data-binary @meta.json
            echo
          }

          APPIMAGE="$(ls dist/*.AppImage | head -1)"
          FLATPAK="$(ls dist/*.flatpak | head -1)"

          # The AppImage is primary: it is the only Linux format that can update
          # itself in place, so it is what the feed must answer with.
          publish "$APPIMAGE" appimage true
          publish "$FLATPAK" flatpak false

          echo "appimage=$(basename "$APPIMAGE")" >> "$GITHUB_OUTPUT"
          echo "appimage_sha=$(sha256sum "$APPIMAGE" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "flatpak=$(basename "$FLATPAK")" >> "$GITHUB_OUTPUT"

  # ── Windows: MSI → R2, MSIX → Microsoft Store ─────────────────────────────
  windows:
    name: Windows (MSI + Store)
    needs: gate
    timeout-minutes: 90
    if: needs.gate.outputs.need_windows == 'true'
    runs-on: ${{ vars.RUNNER_WINDOWS || 'windows-latest' }}
    outputs:
      msi: ${{ steps.package.outputs.msi }}
      published: ${{ steps.package.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Qt
        # Skipped when the runner already has one — see QT_PREFIX at the top of
        # the file. Downloading five gigabytes of Qt onto a machine that has it
        # installed is the single slowest pointless thing a self-hosted run does.
        if: (vars.QT_PREFIX_WINDOWS || vars.QT_PREFIX) == ''
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          modules: ${{ env.QT_MODULES }}
          cache: false   # same reason as the Linux job

      - name: Use the runner's own Qt
        if: (vars.QT_PREFIX_WINDOWS || vars.QT_PREFIX) != ''
        shell: bash
        # Mirrors what install-qt-action exports, so nothing downstream has to
        # know which of the two ran.
        #
        # A Qt you installed and pinned on a machine you control is *better*
        # provenance than a downloaded archive, which is the concern the
        # `cache: false` below was written for — so this does not weaken it.
        run: |
          set -euo pipefail
          QT='${{ vars.QT_PREFIX_WINDOWS || vars.QT_PREFIX }}'
          # CMake reads CMAKE_PREFIX_PATH from the environment using the *platform*
          # list separator, so this is ':' on Linux and ';' on Windows. Getting it
          # backwards produces one unfindable path rather than an error.
          if [ "$RUNNER_OS" = "Windows" ]; then SEP=';'; else SEP=':'; fi
          echo "QT_ROOT_DIR=$QT" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$QT${CMAKE_PREFIX_PATH:+$SEP$CMAKE_PREFIX_PATH}" >> "$GITHUB_ENV"
          echo "$QT/bin" >> "$GITHUB_PATH"
          # The runtime half, and it is not optional on Linux. install-qt-action
          # exports these too, and without them linuxdeploy walks the binary,
          # fails to resolve libQt6Widgets.so.6 and stops — which is what the
          # first real self-hosted run did. Windows finds its DLLs through PATH,
          # which is already set above.
          if [ "$RUNNER_OS" != "Windows" ]; then
            echo "LD_LIBRARY_PATH=$QT/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
            echo "QT_PLUGIN_PATH=$QT/plugins" >> "$GITHUB_ENV"
          fi
      - name: Install Inno Setup
        shell: pwsh
        # The direct-download .exe. Not on windows-latest, like WiX. 6.3 or
        # newer: app.iss.in uses the `x64compatible` architecture spelling,
        # which 6.2 does not know.
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
          }

      - name: Install WiX
        # Skipped where it is already there, which on a persistent runner is
        # every run after the first. `choco install` is idempotent but not
        # quick, and on a machine you own WiX is better installed once by hand
        # than reinstalled by every build.
        run: |
          if (Get-Command candle.exe -ErrorAction SilentlyContinue) {
            Write-Host 'WiX already present.'
          } else {
            choco install wixtoolset -y --no-progress
          }

      - name: Build and package
        id: package
        shell: pwsh
        env:
          MSSTORE_IDENTITY_NAME: ${{ vars.MSSTORE_IDENTITY_NAME }}
          MSSTORE_PUBLISHER: ${{ vars.MSSTORE_PUBLISHER }}
          MSSTORE_PUBLISHER_DISPLAY: ${{ vars.MSSTORE_PUBLISHER_DISPLAY }}
        run: |
          $ErrorActionPreference = 'Stop'
          # Native commands as well as cmdlets. Without this a cmake that fails
          # prints its error, returns non-zero, and the step carries on to build
          # whatever the last good configure left behind — which is exactly how
          # the splat below went unnoticed through every Windows release.
          $PSNativeCommandUseErrorActionPreference = $true

          # Does this app ship for Windows at all? The answer lives in
          # app-info.json, beside the app, rather than in this workflow.
          # Building and testing above still happened: not packaging a platform
          # is not a reason to stop compiling for it.
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          $info = Get-Content -Raw build/app-info.json | ConvertFrom-Json
          if (-not $info.formats.windows) {
            Write-Host "::notice::This app does not ship for Windows — skipping packaging."
            "ships=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          "ships=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          # Pass 1 — the direct-download installer. The store-build option is
          # OFF, so this build keeps its self-updater.
          # @(...) is load-bearing. A pipeline yielding **one** element returns
          # that element rather than an array, and splatting a bare string passes
          # it one character at a time — so a single-flag CONFIGURE_FLAGS reached
          # cmake as `- D C E _ R E Q ...`, which it answered with "Unknown
          # argument -" and carried on. Compose, Play, Relay and Sotto have
          # exactly one flag; the repos with two or more only worked by accident.
          $flags = @($env:CONFIGURE_FLAGS -split '\s+' | Where-Object { $_ })
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release @flags `
                "-D$($env:STORE_BUILD_OPTION)=OFF" 
          cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS
          ctest --test-dir build --output-on-failure -C Release
          ./scripts/package.ps1 -Format msi -BuildDir build -Out dist

          $msi = Get-ChildItem dist -Filter *.msi | Select-Object -First 1
          "msi=$($msi.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          # The .exe, from the tree the .msi just staged and verified — so the
          # two carry identical payloads and cannot drift apart. It has to run
          # after the MSI for that reason, not merely by convention.
          ./scripts/package.ps1 -Format exe -BuildDir build -Out dist
          $exe = Get-ChildItem dist -Filter *.exe | Select-Object -First 1
          "exe=$($exe.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          # Pass 2 — the Store package. Only when there is a listing to submit
          # to; an app without Partner Center identity stops here having still
          # proved the MSI lane works.
          if ($env:MSSTORE_IDENTITY_NAME) {
            cmake -S . -B build "-D$($env:STORE_BUILD_OPTION)=ON" 
            cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS
            ./scripts/package.ps1 -Format msix -BuildDir build -Out dist
            "published=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "::notice::No MSSTORE_IDENTITY_NAME — skipping the MSIX."
            "published=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Say that Windows was built but not shipped
        # PUBLISH_WINDOWS unset means "build and verify, do not ship" — where an
        # app with an untested Windows port sits until someone has installed the
        # .msi on real hardware and watched an upgrade run without a UAC prompt.
        #
        # That is a legitimate state and it used to be a silent one: the job
        # went green, the summary listed the MSI it had not uploaded, and the
        # only way to notice was to query the feed. An unset variable should
        # look different from a successful publish.
        if: vars.PUBLISH_WINDOWS != 'true' && steps.package.outputs.ships == 'true'
        shell: bash
        run: |
          {
            echo "### Windows built, not shipped"
            echo
            echo "\`PUBLISH_WINDOWS\` is not \`true\` in this repository's"
            echo "variables, so the MSI was built and verified but not uploaded."
            echo "Nothing on windows-x86_64 was registered for this version."
            echo
            echo "Set the variable to start shipping this platform."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::PUBLISH_WINDOWS is not set — the MSI was not uploaded."

      - name: Upload the MSI and the .exe, and register both
        if: vars.PUBLISH_WINDOWS == 'true' && steps.package.outputs.ships == 'true'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # A transient 5xx from R2 used to fail a job that had already spent
          # twenty-five minutes building. Adaptive mode backs off rather than
          # hammering, which is what a large multipart upload wants.
          AWS_MAX_ATTEMPTS: '5'
          AWS_RETRY_MODE: adaptive
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          RELEASES_TOKEN: ${{ secrets.MAUVELY_RELEASES_TOKEN }}
          V: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          publish() { # publish <file> <format> <primary>
            local file="$1" format="$2" primary="$3"
            local name; name="$(basename "$file")"
            aws s3 cp "$file" "s3://mauvely-releases/$APP_KEY/$V/$name" \
              --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
              --only-show-errors
            cat > meta.json <<EOF
          {"app":"$APP_KEY","version":"$V","platform":"windows-x86_64",
           "format":"$format","filename":"$name",
           "size":$(stat -c%s "$file"),
           "sha256":"$(sha256sum "$file" | cut -d' ' -f1)",
           "isPrimary":$primary}
          EOF
            curl -fsS -X POST "$API_BASE/api/releases" \
              -H "authorization: Bearer $RELEASES_TOKEN" \
              -H 'content-type: application/json' \
              --data-binary @meta.json
            echo
          }

          # The MSI stays primary. `isPrimary` is what the feed answers with for
          # an update, and Suite's InstallService knows how to install an .msi
          # (msiexec /passive) and does not yet know what to do with an .exe —
          # making the .exe primary would hand the hub an artifact it cannot
          # apply. The .exe is for a person clicking Download.
          publish "$(ls dist/*.msi | head -1)" msi true
          publish "$(ls dist/*.exe | head -1)" exe false

      - name: Set up the Microsoft Store CLI
        if: vars.PUBLISH_WINDOWS == 'true' && steps.package.outputs.published == 'true'
        uses: microsoft/setup-msstore-cli@v1

      - name: Submit to the Store
        if: vars.PUBLISH_WINDOWS == 'true' && steps.package.outputs.published == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Printed so a rejected flag can be read against the version that
          # rejected it: the CLI's argument names have moved between releases.
          msstore --version
          msstore reconfigure \
            --tenantId '${{ secrets.MSSTORE_TENANT_ID }}' \
            --clientId '${{ secrets.MSSTORE_CLIENT_ID }}' \
            --clientSecret '${{ secrets.MSSTORE_CLIENT_SECRET }}' \
            --sellerId '${{ vars.MSSTORE_SELLER_ID }}'
          # The listing itself — description, screenshots, age rating, pricing —
          # is managed in Partner Center and deliberately not here. It is
          # editorial, it changes on a different schedule from the code, and a
          # workflow that rewrote it every release would silently overwrite
          # whatever was last edited by hand.
          msstore publish "$(ls dist/*.msix | head -1)" \
            --productId '${{ vars.MSSTORE_PRODUCT_ID }}'

      - name: Register the Store listing
        # After the submission is accepted, not before: this row is what a
        # pre-Store install is told when it asks where its updates come from
        # now, and it must not claim a version Partner Center refused.
        if: vars.PUBLISH_WINDOWS == 'true' && steps.package.outputs.published == 'true'
        shell: bash
        env:
          RELEASES_TOKEN: ${{ secrets.MAUVELY_RELEASES_TOKEN }}
          V: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          LISTING="https://apps.microsoft.com/detail/${{ vars.MSSTORE_PRODUCT_ID }}"
          curl -fsS -X POST "$API_BASE/api/releases" \
            -H "authorization: Bearer $RELEASES_TOKEN" \
            -H 'content-type: application/json' \
            -d "{\"app\":\"$APP_KEY\",\"version\":\"$V\",
                 \"platform\":\"windows-x86_64\",\"format\":\"msstore\",
                 \"storeUrl\":\"$LISTING\",\"isPrimary\":false}"

  # ── Tag and report ────────────────────────────────────────────────────────
  finalise:
    name: Verify, tag and report
    needs: [gate, linux, windows]
    # `always()` guarded on the gate, because a lane that was skipped — its
    # platform already published — is not a reason to skip the verification.
    # Without this, finishing a half-published version would run one lane and
    # then quietly skip the step that checks the result.
    #
    # `gate.result` as well as its output: a gate that *failed* has still set
    # its outputs by the time this is evaluated, so a repository missing a
    # release secret produced two failures — the real one, and this job
    # failing to verify a version nothing had built.
    if: ${{ !cancelled() && needs.gate.result == 'success' && needs.gate.outputs.should_release == 'true' }}
    runs-on: ${{ vars.RUNNER_LINUX || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: write   # to push the tag
    steps:
      - uses: actions/checkout@v4

      - name: Does the feed actually serve this version?
        # The summary below is built from job outputs, which say what this run
        # *did*. This asks the release service what a user would now be told,
        # which is the only thing that matters and the only thing that was
        # never checked.
        #
        # Compose 0.5.3 shipped an AppImage and a Flatpak with no Windows row
        # and a green build, and stayed that way through several merges. This
        # step is what turns that into a red one.
        env:
          V: ${{ needs.gate.outputs.version }}
          PUBLISH_WINDOWS: ${{ vars.PUBLISH_WINDOWS }}
        run: |
          set -euo pipefail
          RESPONSE="$(curl -fsS --retry 3 "$API_BASE/api/releases?app=$APP_KEY&version=$V")"
          # Through the environment rather than a pipe. The heredoc below *is*
          # stdin — it is where python reads its script from — so the piped
          # response reached nothing and `json.load(sys.stdin)` saw an exhausted
          # stream. This step has failed with "Expecting value: line 1 column 1"
          # on every release since it was written, published or not.
          RESPONSE="$RESPONSE" python3 - "$V" <<'PYEOF'
          import json, os, sys

          version = sys.argv[1]
          items = json.loads(os.environ["RESPONSE"])["items"]
          have = {i["platform"] for i in items if i.get("isPrimary")}

          # Windows is only expected where the repository has opted in. An app
          # that deliberately does not ship Windows must not fail here — that is
          # the difference between "not shipped" and "broken".
          expected = {"linux-x86_64"}
          if os.environ.get("PUBLISH_WINDOWS") == "true":
              expected.add("windows-x86_64")

          missing = sorted(expected - have)
          lines = [f"| {p} | {'yes' if p in have else 'MISSING'} |" for p in sorted(expected)]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### Feed check for {version}\n\n| Platform | Primary row |\n|---|---|\n")
              f.write("\n".join(lines) + "\n\n")

          if missing:
              print(f"::error::{version} has no primary row for: {', '.join(missing)}. "
                    "Re-run this workflow — the gate is per platform and will "
                    "build only what is missing.")
              sys.exit(1)
          print(f"::notice::{version} is served on every expected platform.")
          PYEOF

      - name: Tag the release
        run: |
          set -euo pipefail
          V='${{ needs.gate.outputs.version }}'
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Belt and braces: the gate already established this version is new,
          # but a re-run after a partial failure would otherwise die here.
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "::notice::tag v$V already exists"
          else
            git tag -a "v$V" -m "$APP_KEY $V"
            git push origin "v$V"
          fi

      - name: Summary
        run: |
          V='${{ needs.gate.outputs.version }}'
          {
            echo "### $APP_KEY $V published"
            echo
            echo "| Platform | Format | Artifact |"
            echo "|---|---|---|"
            echo "| linux-x86_64 | appimage (primary) | \`${{ needs.linux.outputs.appimage }}\`<br>sha256 \`${{ needs.linux.outputs.appimage_sha }}\` |"
            echo "| linux-x86_64 | flatpak | \`${{ needs.linux.outputs.flatpak }}\` |"
            echo "| windows-x86_64 | msi (primary) | \`${{ needs.windows.outputs.msi }}\` |"
            echo "| windows-x86_64 | msstore | ${{ needs.windows.outputs.published }} |"
            echo
            echo "A Store submission is **submitted, not live** — certification"
            echo "takes hours to days and the listing serves the previous version"
            echo "until it passes. Track it in Partner Center."
            echo
            echo "- Product page: $API_BASE/apps/$APP_KEY"
          } >> "$GITHUB_STEP_SUMMARY"
